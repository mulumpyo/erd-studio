# deploy 브랜치에 푸시하거나 직접 실행하면
# 코드 검사 → 이미지 빌드 → 서버 배포 순서로 돌아가요.
name: 배포

on:
  push:
    branches: [deploy]
  # Actions 탭에서 직접 눌러도 배포할 수 있어요.
  workflow_dispatch:

# 같은 브랜치 배포가 겹치면, 앞 작업이 끝날 때까지 기다려요.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /home/ubuntu/erd-studio
  SITE_URL: https://erd-studio.com

jobs:
  check:
    name: 코드 검사
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v5

      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Node.js 22 설치
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # lockfile과 패키지가 다르면 여기서 멈춰요.
      - name: 패키지 설치 (lockfile 일치 확인)
        run: pnpm install --frozen-lockfile

      - name: 문법·코드 스타일 검사 (ESLint)
        run: pnpm lint

      - name: 단위 테스트 실행
        run: pnpm test

  build:
    name: 이미지 빌드 (${{ matrix.name }})
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 웹, API, 협업 서버 이미지를 따로 만들어요. Oracle ARM에서 돌아가요.
    strategy:
      matrix:
        include:
          - target: web
            name: web
          - target: api
            name: api
          - target: collab
            name: collab
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v5

      - name: ARM 빌드를 위한 QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 저장소(GHCR) 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ARM 이미지 빌드 후 GHCR에 올리기
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          provenance: false
          push: true
          build-args: |
            VITE_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: 서버에 배포
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v5

      - name: 실행 설정 서버로 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      # GitHub Secrets로 .env를 만들고, 새 이미지로 컨테이너를 다시 띄워요.
      - name: 환경 변수 작성 후 컨테이너 재시작
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SITE_URL: ${{ env.SITE_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_PREFIX,IMAGE_TAG,DEPLOY_DIR,SITE_URL,GHCR_USER,GHCR_TOKEN,JWT_SECRET,POSTGRES_PASSWORD,DATABASE_URL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_SECURE,MAIL_FROM,INITIAL_ADMIN_EMAIL
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            umask 077
            cat > .env <<EOF
            NODE_ENV=production
            WEB_ORIGIN=$SITE_URL
            COOKIE_SECURE=true
            COOKIE_SAMESITE=lax
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES=15m
            JWT_REFRESH_EXPIRES=14d
            POSTGRES_USER=erd
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=erdstudio
            DATABASE_URL=$DATABASE_URL
            REDIS_URL=redis://redis:6379
            WEB_HOST_PORT=8082
            API_HOST_PORT=3001
            COLLAB_HOST_PORT=3030
            WEB_IMAGE=$IMAGE_PREFIX-web:$IMAGE_TAG
            API_IMAGE=$IMAGE_PREFIX-api:$IMAGE_TAG
            COLLAB_IMAGE=$IMAGE_PREFIX-collab:$IMAGE_TAG
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASS=$SMTP_PASS
            SMTP_SECURE=$SMTP_SECURE
            MAIL_FROM=$MAIL_FROM
            INITIAL_ADMIN_EMAIL=$INITIAL_ADMIN_EMAIL
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
