name: Deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /home/ubuntu/erd-studio
  SITE_URL: https://erd-studio.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: web
            name: web
          - target: api
            name: api
          - target: collab
            name: collab
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          provenance: false
          push: true
          build-args: |
            VITE_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Write .env and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SITE_URL: ${{ env.SITE_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_PREFIX,IMAGE_TAG,DEPLOY_DIR,SITE_URL,GHCR_USER,GHCR_TOKEN,JWT_SECRET,POSTGRES_PASSWORD,DATABASE_URL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_SECURE,MAIL_FROM
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            umask 077
            cat > .env <<EOF
            NODE_ENV=production
            WEB_ORIGIN=$SITE_URL
            COOKIE_SECURE=true
            COOKIE_SAMESITE=lax
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES=15m
            JWT_REFRESH_EXPIRES=14d
            POSTGRES_USER=erd
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=erdstudio
            DATABASE_URL=$DATABASE_URL
            REDIS_URL=redis://redis:6379
            WEB_HOST_PORT=8082
            API_HOST_PORT=3001
            COLLAB_HOST_PORT=3030
            WEB_IMAGE=$IMAGE_PREFIX-web:$IMAGE_TAG
            API_IMAGE=$IMAGE_PREFIX-api:$IMAGE_TAG
            COLLAB_IMAGE=$IMAGE_PREFIX-collab:$IMAGE_TAG
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASS=$SMTP_PASS
            SMTP_SECURE=$SMTP_SECURE
            MAIL_FROM=$MAIL_FROM
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
