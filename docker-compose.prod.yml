name: erd-studio

services:
  api:
    image: ${API_IMAGE:-ghcr.io/mulumpyo/erd-studio-api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # collab을 여러 대 띄울 때: @hocuspocus/extension-redis가 REDIS_URL로 문서를 맞춰 줘요.
  # 그래도 WebSocket은 sticky session이 필요해요 (ip_hash / sticky cookie).
  # Redis는 인스턴스 사이 Yjs만 맞추고, 한 연결은 같은 collab에 머물러야 해요.
  # 선택: 복제본마다 COLLAB_INSTANCE_NAME을 주세요 (기본은 랜덤 UUID).
  collab:
    image: ${COLLAB_IMAGE:-ghcr.io/mulumpyo/erd-studio-collab:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      COLLAB_PORT: 3030
    ports:
      - "127.0.0.1:${COLLAB_HOST_PORT:-3030}:3030"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-ghcr.io/mulumpyo/erd-studio-web:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8082}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-erdstudio}
    volumes:
      - erd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-erd} -d ${POSTGRES_DB:-erdstudio}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - erd_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-erd}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-erdstudio}
    volumes:
      - erd_pg_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      echo "postgres daily backup started"
      while true; do
        day=$$(date +%F)
        file="/backups/erdstudio-$$day.dump"
        if [ ! -f "$$file" ]; then
          if pg_dump -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "wrote $$file"
          else
            rm -f "$$file.tmp"
            echo "dump failed"
          fi
        fi
        find /backups -name "erdstudio-*.dump" -mtime +14 -delete
        sleep 3600
      done

volumes:
  erd_pgdata:
  erd_redis:
  erd_pg_backups:
