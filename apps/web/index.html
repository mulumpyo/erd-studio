      [

          "url": "https://erd-studio.com/",

          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Web",
          "description": "브라우저에서 까마귀발 ERD를 그리고, SQL로 주고받고, 팀과 실시간으로 같이 수정하세요. 지금은 베타예요.",

        }
      ]
    </script>
    <script>
      (function () {
        var KEY = 'erd_theme'
        var apply = function (mode) {
          var dark = mode === 'dark'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        }
        try {
          var stored = localStorage.getItem(KEY)
          if (stored !== 'light' && stored !== 'dark') {
            stored = matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            localStorage.setItem(KEY, stored)
          }
          apply(stored)
        } catch (e) {}
        document.addEventListener('click', function (event) {
          var btn = event.target.closest && event.target.closest('[data-theme-toggle]')
          if (!btn) return
          event.preventDefault()
          var current = 'light'
          try {
            current = localStorage.getItem(KEY) === 'dark' ? 'dark' : 'light'
          } catch (err) {}
          var next = current === 'dark' ? 'light' : 'dark'
          try {
            localStorage.setItem(KEY, next)
          } catch (err) {}
          apply(next)
        })
      })()
    </script>
